version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      vitest:
        patterns: ['vitest', '@vitest/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
