name: flowforge
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Generate .env.docker first}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d flowforge']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: tooling
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${DB_ADMIN_PASSWORD}@db:5432/flowforge
      DATABASE_URL: postgresql://ff_app:${DB_APP_PASSWORD:?Generate .env.docker first}@db:5432/flowforge
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: .
      target: runtime
    environment: &runtime
      NODE_ENV: production
      DATABASE_URL: postgresql://ff_app:${DB_APP_PASSWORD}@db:5432/flowforge
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: .
      target: runtime
    environment: *runtime
    command: ['node', 'dist/apps/worker/src/main.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:${WEB_BIND_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
